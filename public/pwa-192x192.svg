<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Canvas Atmosphere -->
    <radialGradient id="canvasGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#111c38" />
      <stop offset="60%" stop-color="#050a17" />
      <stop offset="100%" stop-color="#02040a" />
    </radialGradient>

    <!-- Ambient Cyan/Cobalt Halo behind the card -->
    <radialGradient id="ambientHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <!-- Premium Card Surface (Brushed Obsidian Glass) -->
    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2942" />
      <stop offset="35%" stop-color="#131d33" />
      <stop offset="100%" stop-color="#0a101f" />
    </linearGradient>

    <!-- Card Chamfered Metallic Edge -->
    <linearGradient id="metallicBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#1d4ed8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Subtle Iridescent Hologram Ribbon -->
    <linearGradient id="hologramStrip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="30%" stop-color="#818cf8" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#34d399" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Authentic EMV Smart Chip (Brushed Gold Alloy) -->
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Verified Badge 3D Gradient -->
    <linearGradient id="badgeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="60%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Drop Shadows for 3D Depth -->
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.25" />
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#2563eb" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- 1. Full-Bleed Midnight Canvas -->
  <rect width="512" height="512" fill="url(#canvasGlow)" />

  <!-- 2. Diffuse Ambient Glow -->
  <circle cx="256" cy="250" r="180" fill="url(#ambientHalo)" />

  <!-- 3. MAIN SMART LICENCE CARD (Optimized 380x250 Geometry) -->
  <g filter="url(#cardShadow)">
    <!-- Card Outer Bevel / Border -->
    <rect x="66" y="126" width="380" height="250" rx="32" fill="url(#cardSurface)" stroke="url(#metallicBorder)" stroke-width="5.5" />

    <!-- Inner Specular Light Lip (Top reflection) -->
    <path d="M 98 129 L 414 129" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.35" />

    <!-- Holographic Security Band Across Top -->
    <rect x="70" y="154" width="372" height="38" fill="url(#hologramStrip)" />
  </g>

  <!-- 4. REALISTIC EMV MICROCHIP -->
  <g transform="translate(108, 172)">
    <!-- Chip Base -->
    <rect width="68" height="52" rx="10" fill="url(#goldPlate)" stroke="#78350f" stroke-width="1.5" />
    <!-- Specular Highlight -->
    <rect x="2" y="2" width="64" height="6" rx="3" fill="#ffffff" fill-opacity="0.35" />
    <!-- Authentic Micro-Circuit Cuts -->
    <path d="M 0 26 L 68 26 M 22 0 L 22 52 M 46 0 L 46 52 M 22 14 L 46 14 M 22 38 L 46 38" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="square" />
    <!-- Center Contact Core -->
    <rect x="28" y="20" width="12" height="12" rx="3" fill="#b45309" stroke="#fde047" stroke-width="1" />
  </g>

  <!-- 5. REFINED SECURITY HORIZON & CIVIC LINES -->
  <!-- Header Text Line (High-precision Gov ID simulation) -->
  <rect x="194" y="172" width="150" height="9" rx="4.5" fill="#38bdf8" fill-opacity="0.9" />
  <rect x="194" y="190" width="210" height="6" rx="3" fill="#64748b" fill-opacity="0.75" />
  <rect x="194" y="204" width="170" height="5" rx="2.5" fill="#475569" fill-opacity="0.6" />

  <!-- Highway / Vanishing Road Trajectory on Card Surface -->
  <path d="M 230 318 L 274 246 L 290 246 L 334 318 Z" fill="#0b1324" stroke="#1e3a8a" stroke-width="2" />
  <!-- Glowing Center Road Dashes -->
  <line x1="282" y1="250" x2="282" y2="264" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <line x1="282" y1="274" x2="282" y2="292" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
  <line x1="282" y1="302" x2="282" y2="318" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />

  <!-- Driver Silhouette / Steering Helm Profile Icon -->
  <g transform="translate(108, 252)">
    <circle cx="26" cy="26" r="26" fill="#0c1426" stroke="#2563eb" stroke-width="2.5" />
    <!-- Steering Wheel Precision Arc -->
    <circle cx="26" cy="26" r="17" fill="none" stroke="#94a3b8" stroke-width="3.5" />
    <circle cx="26" cy="26" r="4.5" fill="#38bdf8" />
    <line x1="9" y1="26" x2="21.5" y2="26" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="30.5" y1="26" x2="43" y2="26" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="26" y1="30.5" x2="26" y2="43" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- DL Number Simulation -->
  <rect x="172" y="278" width="120" height="8" rx="4" fill="#94a3b8" fill-opacity="0.8" />
  <rect x="172" y="294" width="80" height="6" rx="3" fill="#475569" fill-opacity="0.6" />

  <!-- 6. ULTRA-POLISHED VERIFIED "SAATHI" SEAL (Anchor Bottom-Right) -->
  <g transform="translate(382, 332)" filter="url(#badgeShadow)">
    <!-- Electric Ambient Rim -->
    <circle cx="0" cy="0" r="54" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6" />
    
    <!-- Outer Deep Shield Base -->
    <circle cx="0" cy="0" r="50" fill="url(#badgeBody)" stroke="#ffffff" stroke-width="4.5" />
    
    <!-- Specular Crescent Shimmer on Badge -->
    <path d="M -35 -20 A 42 42 0 0 1 35 -20 A 46 46 0 0 0 -35 -20 Z" fill="#ffffff" fill-opacity="0.25" />

    <!-- Precision Bold Checkmark -->
    <path d="M -18 0 L -5 13 L 20 -12" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>