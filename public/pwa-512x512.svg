<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Smart Card Surface Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Electric Blue Border Gradient -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Gold Smart Card Chip Gradient -->
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- 1. Full-bleed background for Android Adaptive Icon & Splash -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- 2. Large Bold Driving Licence Card (Expanded to fill the 384px safe area) -->
  <rect x="66" y="126" width="380" height="260" rx="32" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="12" filter="drop-shadow(0 16px 30px rgba(0, 0, 0, 0.7))" />

  <!-- 3. Smart Card EMV Microchip (Enlarged) -->
  <rect x="108" y="168" width="76" height="56" rx="12" fill="url(#chipGrad)" stroke="#b45309" stroke-width="2.5" />
  <line x1="108" y1="196" x2="184" y2="196" stroke="#92400e" stroke-width="3" />
  <line x1="146" y1="168" x2="146" y2="224" stroke="#92400e" stroke-width="3" />
  <circle cx="146" cy="196" r="6" fill="#78350f" />

  <!-- 4. Licence Header Band & Details -->
  <rect x="206" y="168" width="160" height="18" rx="9" fill="#38bdf8" />
  <rect x="206" y="198" width="200" height="12" rx="6" fill="#64748b" />
  <rect x="206" y="218" width="140" height="12" rx="6" fill="#475569" />

  <!-- 5. Driver Profile & Steering Silhouette inside Card -->
  <circle cx="146" cy="298" r="38" fill="#1e293b" stroke="#334155" stroke-width="4" />
  <!-- Steering Rim inside profile frame -->
  <circle cx="146" cy="298" r="26" fill="none" stroke="#94a3b8" stroke-width="6" />
  <circle cx="146" cy="298" r="7" fill="#38bdf8" />
  <line x1="120" y1="298" x2="139" y2="298" stroke="#94a3b8" stroke-width="5" />
  <line x1="153" y1="298" x2="172" y2="298" stroke="#94a3b8" stroke-width="5" />
  <line x1="146" y1="305" x2="146" y2="324" stroke="#94a3b8" stroke-width="5" />

  <!-- Licence Number Emprint Line -->
  <rect x="206" y="278" width="150" height="14" rx="7" fill="#94a3b8" />
  <rect x="206" y="302" width="100" height="10" rx="5" fill="#475569" />

  <!-- 6. Large Verified Saathi Badge (Bottom-Right Anchor) -->
  <circle cx="384" cy="338" r="66" fill="#2563eb" stroke="#020617" stroke-width="10" filter="drop-shadow(0 8px 16px rgba(37, 99, 235, 0.5))" />
  
  <!-- Outer glowing rim for checkmark badge -->
  <circle cx="384" cy="338" r="58" fill="none" stroke="#60a5fa" stroke-width="4" />

  <!-- Bold White Checkmark -->
  <path d="M362 338 L378 354 L410 320" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
</svg>