<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="goldChip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Edge-to-edge background for adaptive splash screen & maskable icons -->
  <rect width="512" height="512" fill="url(#bg)" />

  <!-- Outer Protective Halo (Within 66% Safe Area) -->
  <circle cx="256" cy="256" r="160" fill="#1e293b" fill-opacity="0.3" stroke="#334155" stroke-width="3" />

  <!-- Driving Licence Smart Card Base -->
  <rect x="136" y="160" width="240" height="150" rx="20" fill="#0f172a" stroke="url(#blueGrad)" stroke-width="6" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.6))" />

  <!-- Smart Card Gold EMV Microchip (Indian DL Symbol) -->
  <rect x="162" y="184" width="38" height="28" rx="6" fill="url(#goldChip)" />
  <line x1="162" y1="198" x2="200" y2="198" stroke="#92400e" stroke-width="2" />
  <line x1="181" y1="184" x2="181" y2="212" stroke="#92400e" stroke-width="2" />

  <!-- Driving Licence Detail Lines -->
  <rect x="214" y="184" width="90" height="8" rx="4" fill="#64748b" />
  <rect x="214" y="200" width="135" height="6" rx="3" fill="#334155" />
  <rect x="214" y="214" width="110" height="6" rx="3" fill="#334155" />

  <!-- Indian Highway / Road Trajectory cutting through card -->
  <path d="M220 310 L242 245 L270 245 L292 310 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
  <line x1="256" y1="252" x2="256" y2="270" stroke="#fbbf24" stroke-width="3" stroke-dasharray="4,4" />
  <line x1="256" y1="280" x2="256" y2="305" stroke="#fbbf24" stroke-width="4" />

  <!-- Steering Wheel & Verified Saathi Badge (Bottom-Right Anchor) -->
  <circle cx="340" cy="290" r="42" fill="#2563eb" stroke="#ffffff" stroke-width="5" filter="drop-shadow(0 6px 12px rgba(37,99,235,0.4))" />
  <!-- Checkmark -->
  <path d="M326 290 L336 300 L356 278" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
</svg>